name: Query anecdotes tests 2

on:
  push:
    branches: [xmain]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install query-anecdotes dependencies
        working-directory: query-anecdotes
        run: npm ci

      - name: Install test dependencies
        working-directory: query-anecdotes-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: query-anecdotes-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: query-anecdotes-tests
        run: npm run test:notifications

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: query-anecdotes-notifications-playwright-report
          path: query-anecdotes-tests/playwright-report/
          retention-days: 14
