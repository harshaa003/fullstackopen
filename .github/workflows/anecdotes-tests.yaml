name: Anecdotes tests check

on:
  push:
    branches: [main]

jobs:
  anecdotes-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: part6/anecdotes
        run: npm install

      - name: Install test dependencies
        working-directory: part6/unicafe-tests/anecdotes-tests
        run: npm install

      - name: Install Playwright Chromium
        working-directory: part6/unicafe-tests/anecdotes-tests
        run: npx playwright install --with-deps chromium

      - name: Run Anecdotes tests
        working-directory: part6/unicafe-tests/anecdotes-tests
        run: npm test

      - name: Verify tests are real
        working-directory: part6/unicafe-tests/anecdotes-tests
        run: npm run verify:tests-are-real
